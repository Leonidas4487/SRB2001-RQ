name: Build .pk3

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set output filename
        id: filename
        run: |
          SHORT_SHA="${GITHUB_SHA:0:10}"
          echo "name=SRMFL_SRB2001-RQ_v0-${SHORT_SHA}.pk3" >> "$GITHUB_OUTPUT"

      - name: Package selected folder into PK3
        run: |
          cd src
          zip -r "../../${{ steps.filename.outputs.name }}" .

      - name: Upload PK3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.filename.outputs.name }}
          path: ${{ steps.filename.outputs.name }}
          if-no-files-found: error
