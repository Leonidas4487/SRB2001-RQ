name: Build .pk3

on:
  push:
    branches:
      - main

env:
  SOURCE_FOLDER: src
  PK3_BASENAME: SRMFL_SRB2001-RQ_v0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - name: Build it
        id: pk3
        run: echo "filename=${{ env.PK3_BASENAME }}-${{ steps.sha.outputs.short_sha }}.pk3" >> "$GITHUB_OUTPUT"

      - name: Package into .pk3
        run: |
          if [ ! -d "${{ env.SOURCE_FOLDER }}" ]; then
            echo "Source folder not found: ${{ env.SOURCE_FOLDER }}"
            exit 1
          fi

          mkdir -p build
          cd "${{ env.SOURCE_FOLDER }}"
          zip -r "../build/${{ steps.pk3.outputs.filename }}" . -x "*.git*" -x "*.DS_Store"

      - name: Upload .pk3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pk3.outputs.filename }}
          path: build/${{ steps.pk3.outputs.filename }}
          if-no-files-found: error
